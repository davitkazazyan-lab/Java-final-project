server.port=8080

# TMDB API - Get your free key at https://www.themoviedb.org/settings/api
tmdb.api.key=969b371d1f834aa8766d4c21463f6aa4


# H2 database - saved to ./data/tumo.mv.db (survives restarts)
spring.datasource.url=jdbc:h2:file:./data/tumo
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Jackson 3 fails on JSON null for primitives by default; keep the pre-Boot-4 behaviour (null -> 0)
spring.jackson.deserialization.fail-on-null-for-primitives=false
# Browse the DB at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:file:./data/tumo)mvn spring-boot:run
spring.h2.console.enabled=true